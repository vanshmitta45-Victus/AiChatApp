spring.application.name=ai-chat-app

# Database Configuration (overridable via SPRING_DATASOURCE_* env in docker-compose)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aichatdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# schema.sql is reference for docker pgvector setup; do NOT auto-run on plain local Postgres
# (CREATE EXTENSION vector would fail where extension is not installed).
# VectorDatabaseConfig creates extension + document_chunks table at runtime with graceful fallback.
spring.sql.init.mode=never

# Actuator (for Docker healthcheck)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT Security Configuration (override via JWT_SECRET env in production)
jwt.secret=${JWT_SECRET:ai_chat_app_super_secret_jwt_key_2026_spring_boot_slack_jira_workspace_secure!}
jwt.expiration=86400000

# File Upload & Media Storage
file.upload-dir=./uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Ollama Local Configuration (Conversational Multi-Turn Chat)
ollama.base.url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.api.url=${OLLAMA_API_URL:http://localhost:11434/api/chat}
ollama.model.name=${OLLAMA_MODEL_NAME:llama3.2}

# Conversational Memory & System Prompt
ollama.memory.limit=6
ollama.system.prompt=You are a helpful, knowledgeable, and concise AI assistant. Answer questions accurately using clean Markdown formatting (such as bullet points, bold text, and code blocks where applicable). Maintain conversational continuity and refer to past messages when appropriate.

# RAG & Embedding Configuration
ollama.embedding.url=${OLLAMA_EMBEDDING_URL:http://localhost:11434/api/embeddings}
ollama.embedding.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
rag.chunk.size=500
rag.chunk.overlap=50
rag.top.k=4