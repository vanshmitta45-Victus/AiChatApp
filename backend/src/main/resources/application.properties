spring.application.name=ai-chat-app

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/aichatdb
spring.datasource.username=postgres
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Security Configuration
jwt.secret=ai_chat_app_super_secret_jwt_key_2026_spring_boot_slack_jira_workspace_secure!
jwt.expiration=86400000

# File Upload & Media Storage
file.upload-dir=./uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Ollama Local Configuration (Conversational Multi-Turn Chat)
ollama.base.url=http://localhost:11434
ollama.api.url=http://localhost:11434/api/chat
ollama.model.name=llama3.2

# Conversational Memory & System Prompt
ollama.memory.limit=6
ollama.system.prompt=You are a helpful, knowledgeable, and concise AI assistant. Answer questions accurately using clean Markdown formatting (such as bullet points, bold text, and code blocks where applicable). Maintain conversational continuity and refer to past messages when appropriate.

# RAG & Embedding Configuration
ollama.embedding.url=http://localhost:11434/api/embeddings
ollama.embedding.model=nomic-embed-text
rag.chunk.size=500
rag.chunk.overlap=50
rag.top.k=4